<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><title>Login - Interview AI</title></head>
<body data-page="login">
  <main class="auth-page">
    <div class="form-container">
      <h1>Login</h1>
      <form id="login-form">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="Enter email address" autocomplete="email">
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter password" autocomplete="current-password">
        </div>
        <p id="error" class="error" hidden></p>
        <button id="submit" class="button primary-button">Login</button>
      </form>
      <p>Don't have an account? <a href="/register.html">Register</a></p>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
